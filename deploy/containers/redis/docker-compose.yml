services:
  redis:
    image: redis:7-alpine
    container_name: petradar-redis
    restart: unless-stopped
    networks:
      - petradar-network
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  petradar-network:
    external: true
